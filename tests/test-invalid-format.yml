name: Test invalid results format is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: action
        uses: .
        continue-on-error: true
        with:
          results_file: scorecard-results.out
          results_format: not-a-real-format
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid results_format, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: invalid format rejected"
